name: EAS Build & OTA Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  eas-build-preview:
    name: EAS Build (Preview Distribution)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Types Before Build
        run: npm run typecheck

      # When EXPO_TOKEN is present in repository secrets:
      # - name: Trigger Preview EAS Build
      #   run: eas build --platform all --profile preview --non-interactive
