name: CI - AnonU Quality & Security Verification

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Typecheck, Unit Tests & Security Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Strict Verification
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Setup Java (for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore Security Rules Suite
        run: npx firebase emulators:exec --only firestore "npm run test:rules"
